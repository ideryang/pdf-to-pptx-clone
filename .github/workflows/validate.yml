name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: pip install pyyaml

      - name: Validate SKILL.md frontmatter
        run: |
          python3 << 'PY'
          import re, sys, pathlib, yaml
          p = pathlib.Path("SKILL.md")
          if not p.exists():
              sys.exit("FAIL: SKILL.md missing at repo root")
          text = p.read_text()
          m = re.match(r"---\n(.*?)\n---\n", text, re.DOTALL)
          if not m:
              sys.exit("FAIL: SKILL.md missing YAML frontmatter (--- ... ---)")
          try:
              meta = yaml.safe_load(m.group(1))
          except yaml.YAMLError as e:
              sys.exit(f"FAIL: invalid YAML in frontmatter: {e}")
          for key in ("name", "description"):
              if not meta.get(key):
                  sys.exit(f"FAIL: frontmatter missing required field '{key}'")
          if len(meta["description"]) < 30:
              sys.exit("FAIL: description too short — skills with short descriptions don't trigger reliably")
          print(f"OK: name='{meta['name']}', description={len(meta['description'])} chars")
          PY

      - name: Syntax-check Python scripts
        run: |
          python3 -m py_compile scripts/*.py
          echo "OK: all scripts compile"

      - name: Verify referenced files exist
        run: |
          python3 << 'PY'
          import re, pathlib, sys
          skill = pathlib.Path("SKILL.md").read_text()
          missing = []
          for ref in re.findall(r"`(references/[A-Za-z0-9_./-]+\.md)`", skill):
              if not pathlib.Path(ref).exists():
                  missing.append(ref)
          for ref in re.findall(r"`(scripts/[A-Za-z0-9_./-]+\.py)`", skill):
              if not pathlib.Path(ref).exists():
                  missing.append(ref)
          if missing:
              sys.exit(f"FAIL: SKILL.md references missing files: {missing}")
          print("OK: all SKILL.md references resolve")
          PY

      - name: Check dependencies are importable from source
        run: |
          pip install PyMuPDF python-pptx Pillow fonttools
          python3 -c "
          import importlib, sys
          for name in ('fitz', 'pptx', 'PIL', 'fontTools'):
              importlib.import_module(name)
              print(f'OK: {name}')
          "
